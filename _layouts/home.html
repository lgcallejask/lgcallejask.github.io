---
layout: default
---

<section class="bio-intro">
  {{ content }}
</section>

<section class="writing-section">
  <h2>Writing</h2>
  <ul class="post-list">
    {% for post in site.posts %}
      <li class="post-item">
        <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
        <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</section>
