title: lgcallejask
description: Personal website and writing by lgcallejask.
author: lgcallejask
email: lgcallejask@example.com
url: "https://lgcallejask.github.io"

# Permalink structure
permalink: /writing/:title/

# Build settings
markdown: kramdown
highlighter: rouge
theme: null

# Plugins
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Navigation items
navigation:
  - title: Writing
    url: /
  - title: Topics
    url: /topics/
  - title: Random
    url: "#"
  - title: Projects
    url: /projects/

# Exclude from processing
exclude:
  - README.md
  - .gitignore
