<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author }}">

{% if page.layout == "post" %}
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 160 | default: site.description }}">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    "author": {
      "@type": "Person",
      "name": {{ site.author | jsonify }}
    }
  }
  </script>
{% else %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
{% endif %}

<!-- CSS -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<!-- Favicon / RSS -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<!-- JavaScript -->
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

<!-- Inline Dark Mode & Language Script to avoid FOUC -->
<script>
  window.SITE_TRANSLATIONS = {{ site.data.translations | jsonify }};
  window.SITE_POSTS = [
    {% for post in site.posts %}
      {
        url: "{{ post.url | relative_url }}",
        lang: "{{ post.lang | default: 'en' }}"
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  (function() {
    var storedTheme = localStorage.getItem('theme');
    if (storedTheme) {
      document.documentElement.setAttribute('data-theme', storedTheme);
    }
    var storedLang = localStorage.getItem('lang') || 'en';
    document.documentElement.setAttribute('data-lang', storedLang);
  })();
</script>
