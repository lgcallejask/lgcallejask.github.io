<header>
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <nav>
      {% for item in site.navigation %}
        {% assign nav_key = item.title | downcase %}
        <a href="{{ item.url | relative_url }}" data-nav="{{ nav_key }}" {% if page.url == item.url %}class="active"{% endif %}>
          <span data-i18n="nav.{{ nav_key }}">{{ site.data.translations.en.nav[nav_key] | default: item.title }}</span>
        </a>
      {% endfor %}
      <span id="lang-toggle" title="Toggle language EN/ES (or press 'l')" aria-label="Toggle language" type="button" role="switch" aria-checked="false" tabindex="0">
        <div class="lang-toggle-slide"></div>
        <div class="lang-toggle-switch">
          <span class="lang-label lang-en-label">EN</span>
          <span class="lang-label lang-es-label">ES</span>
        </div>
      </span>
      <span id="theme-toggle" title="Toggle dark mode (or press 'd')" aria-label="Toggle dark mode" type="button" role="switch" aria-checked="false" tabindex="0">
        <div class="theme-toggle-slide"></div>
        <div class="theme-toggle-switch">
          <svg class="theme-icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
          </svg>
          <svg class="theme-icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </div>
      </span>
    </nav>
  </div>
</header>

<script>
  (function() {
    var posts = [
      {% for post in site.posts %}
        {
          url: "{{ post.url | relative_url }}",
          lang: "{{ post.lang | default: 'en' }}"
        }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

    function initRandomPost() {
      var randomBtn = document.querySelector('nav a[data-nav="random"]');
      if (!randomBtn || posts.length === 0) return;

      randomBtn.addEventListener('click', function(e) {
        e.preventDefault();
        var currentLang = document.documentElement.getAttribute('data-lang') || 'en';
        var currentPath = window.location.pathname;

        var langPosts = posts.filter(function(p) {
          return p.lang === currentLang;
        });
        var pool = langPosts.length > 0 ? langPosts : posts;

        var available = pool.filter(function(p) {
          return p.url !== currentPath && p.url !== currentPath + '/';
        });

        var finalPool = available.length > 0 ? available : pool;
        var randomIndex = Math.floor(Math.random() * finalPool.length);
        window.location.href = finalPool[randomIndex].url;
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRandomPost);
    } else {
      initRandomPost();
    }
  })();
</script>
