<header>
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <nav>
      {% for item in site.navigation %}
        <a href="{{ item.url | relative_url }}" data-nav="{{ item.title | downcase }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <span id="theme-toggle" title="Toggle dark mode (or press 'd')" aria-label="Toggle dark mode" type="button" role="switch" aria-checked="false" tabindex="0">
        <div class="theme-toggle-slide"></div>
        <div class="theme-toggle-switch">
          <svg class="theme-icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd" />
          </svg>
          <svg class="theme-icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </div>
      </span>
    </nav>
  </div>
</header>

<script>
  (function() {
    var postUrls = [
      {% for post in site.posts %}
        "{{ post.url | relative_url }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

    function initRandomPost() {
      var randomBtn = document.querySelector('nav a[data-nav="random"]');
      if (!randomBtn || postUrls.length === 0) return;

      randomBtn.addEventListener('click', function(e) {
        e.preventDefault();
        var currentPath = window.location.pathname;
        var available = postUrls.filter(function(url) {
          return url !== currentPath && url !== currentPath + '/';
        });
        var pool = available.length > 0 ? available : postUrls;
        var randomIndex = Math.floor(Math.random() * pool.length);
        window.location.href = pool[randomIndex];
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initRandomPost);
    } else {
      initRandomPost();
    }
  })();
</script>
