<footer>
  <div>
    &copy; {{ 'now' | date: "%Y" }} {{ site.title }}
  </div>
</footer>

<script>
  (function() {
    function initThemeToggle() {
      var toggleBtn = document.getElementById('theme-toggle');
      if (!toggleBtn) return;
      
      function updateThemeState() {
        var currentTheme = document.documentElement.getAttribute('data-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = currentTheme === 'dark' || (!currentTheme && systemDark);
        toggleBtn.setAttribute('aria-checked', isDark ? 'true' : 'false');
      }

      function toggleTheme() {
        var currentTheme = document.documentElement.getAttribute('data-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = currentTheme === 'dark' || (!currentTheme && systemDark);
        var newTheme = isDark ? 'light' : 'dark';
        
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateThemeState();
      }

      toggleBtn.addEventListener('click', toggleTheme);
      toggleBtn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleTheme();
        }
      });

      window.addEventListener('keydown', function(e) {
        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
          return;
        }
        if ((e.key === 'd' || e.key === 'D') && !e.ctrlKey && !e.metaKey && !e.altKey) {
          toggleTheme();
        }
      });

      updateThemeState();
    }

    var postUrls = [
      {% for post in site.posts %}
        "{{ post.url | relative_url }}"{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ];

    function initRandomPost() {
      var randomBtn = document.querySelector('nav a[data-nav="random"]');
      if (!randomBtn || postUrls.length === 0) return;

      randomBtn.addEventListener('click', function(e) {
        e.preventDefault();
        var currentPath = window.location.pathname;
        
        var available = postUrls.filter(function(url) {
          return url !== currentPath && url !== currentPath + '/';
        });

        var pool = available.length > 0 ? available : postUrls;
        var randomIndex = Math.floor(Math.random() * pool.length);
        window.location.href = pool[randomIndex];
      });
    }

    function init() {
      initThemeToggle();
      initRandomPost();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
